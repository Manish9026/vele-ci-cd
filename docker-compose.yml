version: "3.9"

services:
  backend:
    build:
      context: ./server
      args:
        SERVER_ENV_CONTENT: ${SERVER_ENV_CONTENT}
    container_name: vele-backend
    ports:
      - "5000:5000"
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./client
      args:
        CLIENT_ENV_CONTENT: ${CLIENT_ENV_CONTENT}
    container_name: vele-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  mongodb:
    image: mongo:6.0
    container_name: vele-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: vele
    ports:
      - "27017:27017"
