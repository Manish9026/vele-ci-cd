version: "3.9"

services:
  backend:
    build:
      context: ./server
    container_name: vele-backend
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    restart: unless-stopped

  client:
    build:
      context: ./client
    container_name: vele-frontend
    ports:
      - "3000:3000"
    env_file:
      - ./client/.env
    restart: unless-stopped
    depends_on:
      - backend
